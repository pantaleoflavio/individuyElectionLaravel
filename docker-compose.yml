services:
  individuyelection:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: individuyelection
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - storage_data:/var/www/html/storage
      - cache_data:/var/www/html/bootstrap/cache
    networks:
      - individuy_network
    depends_on:
      - individuydb
    command: sh -c "php artisan app:bootstrap && php-fpm"
    
  queue_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: queue_worker
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - storage_data:/var/www/html/storage
      - cache_data:/var/www/html/bootstrap/cache
    networks:
      - individuy_network
    depends_on:
      - individuydb
    command: >
      bash -lc "
        php artisan queue:work --sleep=3 --tries=3 --verbose
      "

  nginx:
    image: nginx:latest
    container_name: individuy_nginx
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - .:/var/www/html
      - storage_data:/var/www/html/storage
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - individuy_network
    depends_on:
      - individuyelection

  individuydb:
    image: postgres:16
    container_name: individuydb
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: individuyitalianilaravel
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - individuy_network

  adminer:
    image: adminer:latest
    container_name: individuy_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    networks:
      - individuy_network
    depends_on:
      - individuydb

networks:
  individuy_network:

volumes:
  db_data:
  vendor_data:
  storage_data:
  cache_data:
