name: individuyElection

on:
  push:
    branches: 
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Installa MariaDB
    - name: Install MariaDB
      run: |
        sudo apt-get update
        sudo apt-get install -y mariadb-server
        sudo service mysql start

    # Configura MariaDB
    - name: Configure MariaDB
      run: |
        sudo mysql -e "SET PASSWORD FOR 'root'@'localhost' = PASSWORD('password');"
        sudo mysql -e "FLUSH PRIVILEGES;"
        sudo mysql -e "CREATE DATABASE IF NOT EXISTS individuyitalianilaravel;"

    # Setup PHP
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, pdo_mysql

    # Install Composer Dependencies
    - name: Install Composer Dependencies
      run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    # Setup Node.js
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install NPM dependencies
      run: npm ci

    - name: Build frontend assets
      run: npm run build

    # Copy .env file and set application key
    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Generate application key
      run: php artisan key:generate

    # Run database migrations
    - name: Run Database Migrations
      env:
        DB_CONNECTION: mariadb
        DB_HOST: localhost
        DB_PORT: 3306
        DB_DATABASE: individuyitalianilaravel
        DB_USERNAME: root
        DB_PASSWORD: password
      run: php artisan migrate --force

    # Run PHPUnit tests
    - name: Run PHPUnit Tests
      env:
        DB_CONNECTION: mariadb
        DB_HOST: localhost
        DB_PORT: 3306
        DB_DATABASE: individuyitalianilaravel
        DB_USERNAME: root
        DB_PASSWORD: password
      run: vendor/bin/phpunit